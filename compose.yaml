services:
  mailbox:
    build: .
    image: dydev420/mailbox:0.2
    container_name: mailbox
    hostname: mail.example.com          # public name of this server
    restart: unless-stopped
    ports:
      - "25:25"     # inbound mail (postscreen)
      - "465:465"   # submission, implicit TLS
      - "587:587"   # submission, STARTTLS
      - "993:993"   # IMAP over TLS
    env_file: .env
    secrets:
      - relay_sasl
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro   # live/ links into archive/
      - /home/vmail:/home/vmail                # Maildirs, uid 5000
      - ./data:/etc/mailsql                    # mail.sqlite

secrets:
  relay_sasl:
    file: ./secrets/relay_sasl